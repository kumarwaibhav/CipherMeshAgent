[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ciphermesh"
version = "0.2.0"
description = "Local-first LLM privacy gateway with distributed TCP agent messaging"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
presidio = ["presidio-analyzer>=2.2.354", "presidio-anonymizer>=2.2.354"]
dev = ["pytest>=8.0", "httpx>=0.27"]
all = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "presidio-analyzer>=2.2.354", "presidio-anonymizer>=2.2.354", "pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
